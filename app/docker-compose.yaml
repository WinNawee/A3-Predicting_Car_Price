services:
  car-price-classifier:
    image: naweep/car-price-classifier:latest
    restart: unless-stopped
    environment:
      - STUDENT_ID=st127031
      # Serve from the bundled model file. The course MLflow server is
      # unstable; set to "1" to load st127031-a3-model/Staging from the
      # registry instead (falls back to the bundled file if unreachable).
      - USE_MLFLOW_REGISTRY=0
    # The ml-brain server no longer runs Traefik (there is no "web" network
    # since A2), so the app is published on its own port like the other A3
    # deployments: http://ml.brain.cs.ait.ac.th:8031 (inside CSIM).
    ports:
      - "8031:8050"

  # Continuous deployment on the server side. GitHub Actions pushes a new
  # image to Docker Hub only after the unit tests pass; this small container
  # checks Docker Hub every 5 minutes and restarts the app when the image
  # changed (up -d does nothing if it is already up to date). The server has
  # no cron, so the loop runs in a container that restarts with the server.
  # Run from a folder named a3-car-price so the project name matches (-p).
  updater:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          docker compose -p a3-car-price -f /deploy/docker-compose.yaml pull -q car-price-classifier
          docker compose -p a3-car-price -f /deploy/docker-compose.yaml up -d car-price-classifier
          sleep 300
        done