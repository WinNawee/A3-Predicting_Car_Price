name: CI/CD - Car Price Classifier App

# On every push: run the unit tests.
# On a push to main, and only if the tests pass: build the Docker image and
# push it to Docker Hub (A3 Task 3, Objective 3).
#
# How the new image reaches the ml-brain server:
#   ml-brain is only reachable from inside CSIM (or through the bazooka jump
#   host), so GitHub's runners cannot SSH into it. Instead the server pulls:
#   a cron job on ml-brain runs `docker compose pull && docker compose up -d`
#   every 5 minutes (see app/deploy/auto_update.sh). Because the image is only
#   pushed when the tests pass, a failing commit never reaches the server.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   required for the deploy job
#                                         (use a Docker Hub access token)
#   SSH_HOST, SSH_USER, SSH_KEY           optional: if set, the job also SSHes
#   SSH_PROXY_HOST, SSH_PROXY_USER,       into the server and restarts the app
#   SSH_PROXY_PASSWORD                    right away instead of waiting for cron
# If the Docker Hub secrets are not set, the deploy job skips with a notice
# instead of failing.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/code/requirements.txt

      - name: Run unit tests (pytest)
        run: pytest app/tests/ -v

  deploy:
    name: Build, push and deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/car-price-classifier
      DEPLOY_DIR: a3-car-price
    steps:
      - name: Check which deploy secrets are set
        id: secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to push the image."
          fi
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "ssh=true" >> "$GITHUB_OUTPUT"
          else
            echo "ssh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SSH secrets: the server picks up the new image with its cron job (within 5 minutes)."
          fi

      - name: Check out repository
        if: steps.secrets.outputs.docker == 'true'
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: steps.secrets.outputs.docker == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.secrets.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Copy docker-compose.yaml to the server
        if: steps.secrets.outputs.docker == 'true' && steps.secrets.outputs.ssh == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          proxy_host: ${{ secrets.SSH_PROXY_HOST }}
          proxy_username: ${{ secrets.SSH_PROXY_USER || secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_KEY }}
          proxy_password: ${{ secrets.SSH_PROXY_PASSWORD }}
          source: app/docker-compose.yaml
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Pull the new image and restart the container
        if: steps.secrets.outputs.docker == 'true' && steps.secrets.outputs.ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          proxy_host: ${{ secrets.SSH_PROXY_HOST }}
          proxy_username: ${{ secrets.SSH_PROXY_USER || secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_KEY }}
          proxy_password: ${{ secrets.SSH_PROXY_PASSWORD }}
          script: |
            cd ${{ env.DEPLOY_DIR }}
            docker compose pull
            docker compose up -d
            docker image prune -f